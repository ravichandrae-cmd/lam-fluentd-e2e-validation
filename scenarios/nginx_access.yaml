id: "nginx"
name: "Nginx Access Log Validation"
description: "E2E comparison of parsed nginx access logs between google-fluentd and OSS Fluentd + Google Cloud plugin."
source_type: "nginx"
baseline_agent: "google-fluentd"
upstream_agent: "oss-fluentd-plugin"

expected_log_name: "nginx.access"
expected_resource_type: "gce_instance"
expected_payload_type: "json"
expected_fields:
  - "agent"
  - "code"
  - "host"
  - "method"
  - "path"
  - "referer"
  - "remote"
  - "size"
  - "user"

comparison_keys:
  - "resource.type"
  - "resource.labels"
  - "jsonPayload.remote"
  - "jsonPayload.host"
  - "jsonPayload.method"
  - "jsonPayload.path"
  - "jsonPayload.code"
  - "jsonPayload.size"
  - "jsonPayload.referer"
  - "jsonPayload.agent"
  - "jsonPayload.user"

correlation_key: "jsonPayload.path"
notes: "Verifies logName substring matching, GCE resource types, existence of required payload fields, 200/404 records, and compares metadata labels."
